  </pattern>
  <filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#6d3f4d" flood-opacity=".13"/></filter>
  <style>
    .serif{font-family:'Cormorant Garamond','EB Garamond','GFS Baskerville',serif;fill:#44343b}
    .script{font-family:'Great Vibes','URW Chancery L',cursive;fill:#925c6c}
    .sans{font-family:'DM Sans','DejaVu Sans',sans-serif;fill:#7c6b73}
    .wine{fill:#925c6c}.gold{fill:#c8a15d}.smallcaps{font-family:'DM Sans','DejaVu Sans',sans-serif;font-weight:700;letter-spacing:5px;text-transform:uppercase;fill:#b66073}
  </style>
</defs>

